services:
  postgres:
    image: postgres:16

    container_name: ai-contract-postgres

    environment:
      POSTGRES_DB: contract_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend

    container_name: ai-contract-backend

    ports:
      - "8001:8001"

    volumes:
      - ./backend:/app

    env_file:
      - ./backend/.env

    depends_on:
      postgres:
        condition: service_healthy

    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  postgres_data: